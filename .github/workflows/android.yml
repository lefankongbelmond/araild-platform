# Application Android MX-CONNECT (TWA) — compilation, analyse lint et artefacts.
# - APK de test (debug) à chaque modification de android/ ou à la demande ;
# - AAB + APK signés (version publiée) seulement si les secrets de signature existent :
#   MX_KEYSTORE_BASE64, MX_KEYSTORE_PASSWORD, MX_KEY_ALIAS, MX_KEY_PASSWORD.
# Aucun secret n'est écrit dans le dépôt ni dans les journaux.
name: Android

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (entier croissant)"
        required: false
        default: ""
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      HAS_KEY: ${{ secrets.MX_KEYSTORE_BASE64 != '' }}
      VERSION_ARG: ${{ inputs.version_code != '' && format('-PmxVersionCode={0}', inputs.version_code) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4   # vérifie aussi l'empreinte du gradle-wrapper.jar

      - name: APK de test + lint
        run: ./gradlew --no-daemon $VERSION_ARG assembleDebug lintDebug

      - name: Clé de signature (depuis les secrets)
        if: env.HAS_KEY == 'true'
        env:
          MX_KEYSTORE_BASE64: ${{ secrets.MX_KEYSTORE_BASE64 }}
        run: |
          echo "$MX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "MX_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Version publiée signée (AAB + APK)
        if: env.HAS_KEY == 'true'
        env:
          MX_KEYSTORE_PASSWORD: ${{ secrets.MX_KEYSTORE_PASSWORD }}
          MX_KEY_ALIAS: ${{ secrets.MX_KEY_ALIAS }}
          MX_KEY_PASSWORD: ${{ secrets.MX_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon $VERSION_ARG bundleRelease assembleRelease
          # Empreinte SHA-256 du certificat (publique) à coller dans Réseau → Application Android → Réglages.
          keytool -list -v -keystore "$MX_KEYSTORE_PATH" -storepass "$MX_KEYSTORE_PASSWORD" -alias "$MX_KEY_ALIAS" | grep -E "SHA256:" || true

      - name: Supprimer la clé du disque
        if: always() && env.HAS_KEY == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Empreintes des fichiers produits
        run: find app/build/outputs -name "*.apk" -o -name "*.aab" | xargs -r sha256sum

      - uses: actions/upload-artifact@v4
        with:
          name: mxconnect-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: mxconnect-android-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mxconnect-android-lint
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
