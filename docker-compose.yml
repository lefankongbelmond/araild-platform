version: '3.9'

services:

  # ─── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: araild_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: araild_db
      POSTGRES_USER: araild_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-araild_secure_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U araild_user -d araild_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: araild_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://araild_user:${DB_PASSWORD:-araild_secure_2024}@postgres:5432/araild_db
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://araild.com}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-contact@araild.com}
    ports:
      - "4000:4000"
    volumes:
      - ./backend/uploads:/app/uploads

  # ─── Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.araild.com/api}
        NEXT_PUBLIC_STRIPE_PK: ${STRIPE_PUBLISHABLE_KEY}
    container_name: araild_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.araild.com/api}
    ports:
      - "3000:3000"

  # ─── Nginx reverse proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: araild_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

  # ─── Certbot (SSL) ────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: araild_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    command: >
      certonly --webroot -w /var/www/certbot
      -d araild.com -d www.araild.com
      --email contact@araild.com
      --agree-tos --no-eff-email

volumes:
  postgres_data:
  certbot_www:
  certbot_certs:
