# MX-CONNECT — Nginx server block (LWS VPS). Central domain + wildcard tenant subdomains.
server {
    listen 80;
    server_name mx-connect.com www.mx-connect.com *.mx-connect.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mx-connect.com www.mx-connect.com *.mx-connect.com;   # wildcard = one block serves all tenants

    root /var/www/mx-connect/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/mx-connect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mx-connect.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }


    # --- Phase 5: Reverb WebSocket + events API (proxied to the local Reverb process) ---
    location ~ ^/(app|apps) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
