; MX-CONNECT queue worker (Phase 3). Place in /etc/supervisor/conf.d/ and
;   supervisorctl reread && supervisorctl update
; Runs N worker processes draining the Redis queue. Scale numprocs with load.
[program:mxconnect-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/mx-connect/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600 --backoff=10
directory=/var/www/mx-connect
autostart=true
autorestart=true
stopwaitsecs=3600
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/mx-connect/worker.log
stdout_logfile_maxbytes=50MB
