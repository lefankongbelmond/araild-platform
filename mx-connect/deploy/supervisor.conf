; MX-CONNECT — Supervisor: queue workers (reminders, reconciliation, notifications, indicators).
[program:mxconnect-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/mx-connect/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/mx-connect/storage/logs/queue.log
stopwaitsecs=3600

; Phase 5 — Laravel Reverb (PHP WebSocket server for the social feed).
[program:mxconnect-reverb]
command=php /var/www/mx-connect/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/mx-connect/storage/logs/reverb.log
