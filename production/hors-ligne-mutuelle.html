<head>

  <title>Hors ligne · MX-CONNECT Mutuelle</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#0B2559,#123B85);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14223B}

    p{margin:0 0 12px;color:#3B4A60}

<body>
  <main class="box">
    <img src="/installer/fichiers/mx-mark-128.webp" alt="MX-CONNECT">

    <p>Vérifiez votre connexion, puis réessayez.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
